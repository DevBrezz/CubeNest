
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Bedrock CurseForge catalogue
        continue-on-error: true
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/sync-bedrock-curseforge.mjs

      - name: Build site
        env:
          VITE_CUBENEST_API_URL: ${{ secrets.CUBENEST_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_CUBENEST_API_URL" ]; then
            echo "::error::CUBENEST_API_URL secret is missing."
            echo "Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

          case "$VITE_CUBENEST_API_URL" in
            https://*) ;;
            *)
              echo "::error::CUBENEST_API_URL must start with https://"
              exit 1
              ;;
          esac

          npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || {
            echo "ERROR: dist/index.html missing"
            exit 1
          }

          test -f dist/data/resources.json || {
            echo "ERROR: dist/data/resources.json missing — resource catalogue was not generated"
            exit 1
          }

          if grep -q 'src/main.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still points to the development entry"
            exit 1
          fi

          cp dist/index.html dist/404.html
          echo "Build output verified."
          ls -la dist/
          ls -la dist/data/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
