name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync Bedrock CurseForge catalogue
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/sync-bedrock-curseforge.mjs

      - name: Sync 9Minecraft Bedrock catalogue
        continue-on-error: true
        run: node scripts/sync-9minecraft.mjs

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/data/resources.json || (echo "dist/data/resources.json missing — plugins will not load" && exit 1)
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still points to /src/main.tsx (dev entry). Build failed."
            exit 1
          fi
          cp dist/index.html dist/404.html
          ls -la dist/
          ls -la dist/data/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
