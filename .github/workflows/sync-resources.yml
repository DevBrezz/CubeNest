name: Sync Resources

on:
  schedule:
    - cron: '17 * * * *'   # every hour; updates appear after the sync commits and site deploys
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-resources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run sync
        run: node scripts/sync-resources.mjs
      - name: Sync CurseForge creator resources
        run: node scripts/sync-curseforge.mjs
      - name: Sync Bedrock resources from CurseForge
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: node scripts/sync-bedrock-curseforge.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/resources.json public/data/curseforge.json public/data/bedrock-curseforge.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync resources $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
