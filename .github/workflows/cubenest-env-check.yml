
name: CubeNest Environment Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/cubenest-env-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure CubeNest API URL
        env:
          REPOSITORY_API_URL: ${{ vars.VITE_CUBENEST_API_URL }}
        run: |
          API_URL="${REPOSITORY_API_URL:-}"

          if [ -z "$API_URL" ]; then
            echo "::warning::Repository variable VITE_CUBENEST_API_URL was not available."
            echo "Check repository Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          case "$API_URL" in
            https://*) ;;
            *)
              echo "::error::VITE_CUBENEST_API_URL must start with https://"
              exit 1
              ;;
          esac

          echo "VITE_CUBENEST_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "CubeNest API URL configured."

      - name: Build frontend
        run: npm run build
        env:
          VITE_CUBENEST_API_URL: ${{ vars.VITE_CUBENEST_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
